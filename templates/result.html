<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نتيجتك التقنية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'academic-blue': '#0D2B45',
                        'tech-blue': '#2094D0',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="result-box" class="max-w-3xl mx-auto my-12 p-8 bg-white rounded-2xl shadow-2xl border-t-8 border-tech-blue text-right">
        <h1 class="text-3xl font-bold text-academic-blue mb-4 font-['Cairo']">التخصص المقترح لك هو:</h1>
        <h2 id="major-name" class="text-4xl font-black text-tech-blue mb-6 font-['Cairo']"></h2>
        <p class="text-lg text-gray-600 mb-8 border-b pb-6">بناءً على تحليل إجاباتك العشر، أنت تمتلك سمات تتوافق مع هذا المسار التقني في الكلية.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="p-4 bg-gray-50 border-r-4 border-tech-blue rounded-l-lg"><strong class="block text-academic-blue mb-2">لماذا هذا التخصص؟</strong> <p id="reason" class="text-sm text-gray-700"></p></div>
            <div class="p-4 bg-gray-50 border-r-4 border-tech-blue"><strong class="block text-academic-blue mb-2">المهارات المطلوبة:</strong> <p id="skills" class="text-sm text-gray-700"></p></div>
            <div class="p-4 bg-gray-50 border-r-4 border-tech-blue rounded-l-lg"><strong class="block text-academic-blue mb-2">الوظائف المتاحة:</strong> <p id="jobs" class="text-sm text-gray-700"></p></div>
        </div>

        <div id="challenge-section" class="bg-blue-50 p-6 rounded-xl mb-8">
            <h3 class="text-xl font-bold text-academic-blue mb-3 font-['Cairo']">تحدّي التخصص</h3>
            <p id="challenge-text" class="text-gray-800 italic"></p>
        </div>

        <button onclick="window.location.href='/'" class="w-full md:w-auto bg-academic-blue hover:bg-black text-white py-3 px-10 rounded-lg font-bold transition-all font-['Cairo']">إعادة الاختبار</button>
    </div>

    <script>
        // استرجاع البيانات من sessionStorage التي تم تخزينها في script.js
        const data = JSON.parse(sessionStorage.getItem('resultData'));
        if (data) {
            // تقسيم النص عند القوس ليكون الاسم الإنجليزي في سطر جديد
            document.getElementById('major-name').innerHTML = data.name ? data.name.replace(' (', '<br>(') : 'تخصص تقني';
            document.getElementById('reason').innerText = data.reason;
            document.getElementById('skills').innerText = data.skills;
            document.getElementById('jobs').innerText = data.jobs;
            document.getElementById('challenge-text').innerText = data.challenge;
        } else {
            // إعادة توجيه المستخدم للرئيسية إذا لم تكن هناك نتائج
            window.location.href = '/';
        }
    </script>
</body>
</html>
